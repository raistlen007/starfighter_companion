<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="space" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#1d2a4a"/>
      <stop offset="0.55" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#03050c"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dfe7f2"/>
      <stop offset="0.55" stop-color="#9fb0c8"/>
      <stop offset="1" stop-color="#e9eef6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="44"/></clipPath>
    <g id="bolt">
      <rect x="-34" y="-5" width="68" height="10" rx="5" filter="url(#glow)"/>
      <rect x="-30" y="-3" width="60" height="6" rx="3"/>
      <rect x="-26" y="-1.3" width="52" height="2.6" rx="1.3" fill="#ffffff"/>
    </g>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#space)"/>
  <g clip-path="url(#tile)">
    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="40" cy="44" r="1.2" opacity="0.8"/><circle cx="210" cy="36" r="1" opacity="0.7"/>
      <circle cx="226" cy="120" r="1.3" opacity="0.6"/><circle cx="30" cy="150" r="1" opacity="0.6"/>
      <circle cx="120" cy="30" r="0.9" opacity="0.5"/><circle cx="70" cy="222" r="1.1" opacity="0.6"/>
      <circle cx="190" cy="224" r="0.9" opacity="0.5"/><circle cx="150" cy="58" r="0.8" opacity="0.5"/>
    </g>
    <!-- Rebel lasers (red), streaking down-right through the top -->
    <g fill="#ff2a2a" transform="rotate(-24 128 128)">
      <use href="#bolt" x="196" y="62"/>
      <use href="#bolt" x="210" y="76"/>
    </g>
    <!-- Imperial lasers (green), along the bottom -->
    <g fill="#2dff6a" transform="rotate(-24 128 128)">
      <use href="#bolt" x="46" y="196"/>
      <use href="#bolt" x="60" y="210"/>
    </g>
  </g>

  <!-- letters: shadow, dark outline, metal face -->
  <g fill="none" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="square" transform="translate(22 2) skewX(-10)">
    <g stroke="#000000" stroke-width="34" opacity="0.55" filter="url(#soft)" transform="translate(3 5)">
      <path d="M116 84 L60 84 L48 96 L48 116 L60 128 L104 128 L116 140 L116 160 L104 172 L48 172"/>
      <path d="M210 84 L156 84 L144 96 L144 160 L156 172 L210 172"/>
    </g>
    <g stroke="#0a1430" stroke-width="30">
      <path d="M116 84 L60 84 L48 96 L48 116 L60 128 L104 128 L116 140 L116 160 L104 172 L48 172"/>
      <path d="M210 84 L156 84 L144 96 L144 160 L156 172 L210 172"/>
    </g>
    <g stroke="url(#metal)" stroke-width="22">
      <path d="M116 84 L60 84 L48 96 L48 116 L60 128 L104 128 L116 140 L116 160 L104 172 L48 172"/>
      <path d="M210 84 L156 84 L144 96 L144 160 L156 172 L210 172"/>
    </g>
  </g>
  <rect x="8.5" y="8.5" width="239" height="239" rx="43.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>
